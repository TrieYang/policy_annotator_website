re activation.","\u003cb\u003eSection:\u003c\u002fb\u003e Usage Constraints\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e AIDA.Art.5\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 2\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e While the section establishes basic usage restrictions, it\u003cbr\u003elacks clear measures for assessing if the system qualifies\u003cbr\u003eas 'high-impact' as defined in Article 5(1). The geographic\u003cbr\u003eand identity verification constraints are good starting\u003cbr\u003epoints, but should explicitly address regulated activity\u003cbr\u003ecriteria and responsibility assessment per 5(2). To improve\u003cbr\u003ecompliance, add specific classification criteria and\u003cbr\u003eresponsibility assignments.\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e Use restricted to Indian territory and authorized partners.\u003cbr\u003eDeployment in military zones or border areas is prohibited.\u003cbr\u003eAPI access throttled to prevent unauthorized scanning of\u003cbr\u003eprivate land. Users must verify their identity and field\u003cbr\u003eownership before activation.","\u003cb\u003eSection:\u003c\u002fb\u003e Usage Constraints\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e AIDA.Art.6\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 2\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e While the section establishes usage restrictions, it does\u003cbr\u003enot address measures for data anonymization as required by\u003cbr\u003eArticle 6. The section should specify how anonymized data is\u003cbr\u003emanaged when enforcing usage constraints and detail the\u003cbr\u003emeasures for data anonymization in line with regulatory\u003cbr\u003erequirements.\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e Use restricted to Indian territory and authorized partners.\u003cbr\u003eDeployment in military zones or border areas is prohibited.\u003cbr\u003eAPI access throttled to prevent unauthorized scanning of\u003cbr\u003eprivate land. Users must verify their identity and field\u003cbr\u003eownership before activation.","\u003cb\u003eSection:\u003c\u002fb\u003e Usage Constraints\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e AIDA.Art.7\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 2\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e While the section includes usage restrictions, it does not\u003cbr\u003eindicate whether the system has been assessed as a\u003cbr\u003ehigh-impact system as required by Article 7. The section\u003cbr\u003eshould explicitly state whether AgriScan has been assessed\u003cbr\u003efor high-impact classification and include any relevant\u003cbr\u003eassessment outcomes.\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e Use restricted to Indian territory and authorized partners.\u003cbr\u003eDeployment in military zones or border areas is prohibited.\u003cbr\u003eAPI access throttled to prevent unauthorized scanning of\u003cbr\u003eprivate land. Users must verify their identity and field\u003cbr\u003eownership before activation.","\u003cb\u003eSection:\u003c\u002fb\u003e Usage Constraints\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e AIDA.Art.8\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 2\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e While the section includes some risk mitigation through\u003cbr\u003eidentity verification and access controls, it lacks explicit\u003cbr\u003emeasures to identify, assess and mitigate risks of harm or\u003cbr\u003ebiased output as required by Article 8. To improve\u003cbr\u003ecompliance, add specific details about how usage\u003cbr\u003erestrictions address potential harms and bias risks.\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e Use restricted to Indian territory and authorized partners.\u003cbr\u003eDeployment in military zones or border areas is prohibited.\u003cbr\u003eAPI access throttled to prevent unauthorized sca

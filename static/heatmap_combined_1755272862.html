cument.","\u003cb\u003eSection:\u003c\u002fb\u003e Terms and conditions\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e CCPA.Art.1798.115\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 0\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e No evaluation\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e No existing terms and conditions document.","\u003cb\u003eSection:\u003c\u002fb\u003e Terms and conditions\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e CCPA.Art.1798.120\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 0\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e No evaluation\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e No existing terms and conditions document.","\u003cb\u003eSection:\u003c\u002fb\u003e Terms and conditions\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e CCPA.Art.1798.121\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 0\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e No evaluation\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e No existing terms and conditions document.","\u003cb\u003eSection:\u003c\u002fb\u003e Terms and conditions\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e CCPA.Art.1798.125\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 3\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e The lack of terms and conditions creates possible risk as\u003cbr\u003eCCPA prohibits discrimination against consumers exercising\u003cbr\u003etheir privacy rights. To fix this, include\u003cbr\u003enon-discrimination provisions in the terms and conditions\u003cbr\u003edocument.\u003cbr\u003e\u003cb\u003eSection Content:\u003c\u002fb\u003e No existing terms and conditions document.","\u003cb\u003eSection:\u003c\u002fb\u003e Terms and conditions\u003cbr\u003e\u003cb\u003eArticle:\u003c\u002fb\u003e CCPA.Art.1798.126\u003cbr\u003e\u003cb\u003eScore:\u003c\u002fb\u003e 0\u003cbr\u003e\u003cb\u003eReasoning:\u003c\u002fb\u003e No evaluation\u003cb
